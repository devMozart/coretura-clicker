<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/core.svg" />
    <title>Coretura Clicker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg-layer bg-a" aria-hidden="true"></div>
    <div class="bg-layer bg-b" aria-hidden="true"></div>
    <div class="bg-shade" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <img src="/core.svg" class="brand-mark" alt="Coretura" />
        <span class="brand-name">CORETURA <em>CLICKER</em></span>
      </div>
      <div class="topbar-right">
        <div class="stat" title="Permanent bonus from achievements">
          <span class="stat-label">code quality</span>
          <span id="quality" class="stat-value">+0%</span>
        </div>
        <button id="mute" class="icon-btn" aria-label="Toggle sound">🔊</button>
      </div>
    </header>

    <main class="layout">
      <section class="stage" id="stage">
        <div class="readout">
          <div id="loc" class="loc-count">0</div>
          <div class="loc-label">lines of code</div>
          <div id="lps" class="lps">0 LoC/s</div>
          <div id="effects" class="effects"></div>
        </div>

        <div class="core-wrap" id="core-wrap">
          <button id="core" class="core" aria-label="Write code">
            <svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
              <defs>
                <clipPath id="core-clip">
                  <circle cx="90" cy="90" r="90" />
                </clipPath>
                <radialGradient id="core-blue" cx="106.65" cy="104.92" r="71.08" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#008fc9" />
                  <stop offset=".11" stop-color="#008fc9" stop-opacity=".95" />
                  <stop offset=".28" stop-color="#008fc9" stop-opacity=".82" />
                  <stop offset=".5" stop-color="#008fc9" stop-opacity=".6" />
                  <stop offset=".76" stop-color="#008fc9" stop-opacity=".3" />
                  <stop offset="1" stop-color="#008fc9" stop-opacity="0" />
                </radialGradient>
                <radialGradient id="core-pink" cx="69.97" cy="74.16" r="68.23" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#f64370" />
                  <stop offset=".09" stop-color="#f64370" stop-opacity=".96" />
                  <stop offset=".23" stop-color="#f64370" stop-opacity=".86" />
                  <stop offset=".42" stop-color="#f64370" stop-opacity=".69" />
                  <stop offset=".63" stop-color="#f64370" stop-opacity=".46" />
                  <stop offset=".87" stop-color="#f64370" stop-opacity=".16" />
                  <stop offset="1" stop-color="#f64370" stop-opacity="0" />
                </radialGradient>
              </defs>
              <g clip-path="url(#core-clip)">
                <rect width="180" height="180" fill="#001220" />
                <circle fill="url(#core-blue)" cx="106.65" cy="104.92" r="71.08" />
                <circle fill="url(#core-pink)" cx="69.97" cy="74.16" r="68.23" />
                <path
                  fill="#fff"
                  d="M92.73,113.57v31.96c.58.02,1.17.03,1.76.03,15.24,0,29.05-6.13,39.1-16.06l-22.34-22.34c-4.43,4.03-10.31,6.48-16.76,6.48-.59,0-1.18-.02-1.76-.06M90.72,64.08v-29.65c-28.96,1.94-51.86,26.04-51.86,55.5s22.89,53.56,51.86,55.5v-32.08c-11.97-1.82-21.15-12.16-21.15-24.64s9.18-22.82,21.15-24.64"
                />
              </g>
            </svg>
          </button>
        </div>

        <div class="hint">Click the Core to write code — <kbd>Space</kbd> works too</div>
        <div id="floaters" class="floaters" aria-hidden="true"></div>
      </section>

      <aside class="store">
        <div class="funding-panel">
          <div class="funding-info">
            <span class="funding-label">Funding</span>
            <span class="funding-sub">shipped code becomes funding</span>
          </div>
          <span id="funding" class="funding-value">€0</span>
        </div>

        <section class="store-section">
          <h2>Upgrades</h2>
          <div id="upgrades" class="upgrade-tray empty"></div>
        </section>

        <section class="store-section store-section-grow">
          <div class="store-head">
            <h2>Team &amp; Infrastructure</h2>
            <div class="buy-toggle" id="buy-toggle">
              <button data-amount="1" class="active">×1</button>
              <button data-amount="10">×10</button>
              <button data-amount="100">×100</button>
            </div>
          </div>
          <div id="producers" class="producer-list"></div>
        </section>
      </aside>
    </main>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <div id="tooltip" class="tooltip hidden" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
