<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Coretura Clicker — an incremental game about shipping code</title>
    <meta
      name="description"
      content="A free incremental clicker game: click the Core to write code, turn it into funding, and scale from a single intern to a self-improving vehicle platform."
    />
    <link rel="canonical" href="https://coretura-clicker.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coretura Clicker" />
    <meta property="og:title" content="Coretura Clicker — an incremental game about shipping code" />
    <meta
      property="og:description"
      content="Click the Core to write code. Ship it into funding and scale from one intern to a self-improving vehicle platform."
    />
    <meta property="og:url" content="https://coretura-clicker.vercel.app/" />
    <meta property="og:image" content="https://coretura-clicker.vercel.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Coretura Core beside the words Coretura Clicker" />
    <meta property="og:locale" content="en" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Coretura Clicker — an incremental game about shipping code" />
    <meta
      name="twitter:description"
      content="Click the Core to write code. Ship it into funding and scale from one intern to a self-improving vehicle platform."
    />
    <meta name="twitter:image" content="https://coretura-clicker.vercel.app/og.jpg" />
    <meta name="twitter:image:alt" content="The Coretura Core beside the words Coretura Clicker" />

    <link rel="icon" type="image/svg+xml" href="/core.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#001220" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coretura Clicker" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Coretura Clicker",
        "url": "https://coretura-clicker.vercel.app/",
        "image": "https://coretura-clicker.vercel.app/og.jpg",
        "description": "A free incremental clicker game: click the Core to write code, turn it into funding, and scale from a single intern to a self-improving vehicle platform.",
        "applicationCategory": "GameApplication",
        "genre": "Incremental",
        "gamePlatform": "Web browser",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": "en",
        "author": {
          "@type": "Person",
          "name": "Amadeus Zancotti",
          "url": "https://www.linkedin.com/in/amadeuszancotti/"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
  </head>
  <body>
    <div class="bg-layer bg-a" aria-hidden="true"></div>
    <div class="bg-layer bg-b" aria-hidden="true"></div>
    <div class="bg-shade" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <img src="/core.svg" class="brand-mark" alt="Coretura" />
        <div class="brand-text">
          <span class="brand-name">CORETURA <em>CLICKER</em></span>
          <a class="brand-ad" href="https://coretura.com" target="_blank" rel="noopener noreferrer">
            Interested in the future of trucks? <em>Learn more.</em>
          </a>
        </div>
      </div>
      <div class="topbar-right">
        <div class="stat" title="Permanent bonus from achievements">
          <span class="stat-label">code quality</span>
          <span id="quality" class="stat-value">+0%</span>
        </div>
        <div class="menu">
          <button
            id="menu-btn"
            class="icon-btn"
            aria-label="Menu"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="menu-panel"
          >
            ☰
          </button>
          <div id="menu-panel" class="menu-panel hidden" role="menu">
            <button id="menu-sound" class="menu-item" role="menuitemcheckbox" aria-checked="true">
              <span id="menu-sound-icon" class="menu-icon">🔊</span>
              <span id="menu-sound-label">Sound on</span>
            </button>
            <button id="menu-restart" class="menu-item menu-danger" role="menuitem">
              <span class="menu-icon">↺</span>
              <span>Restart game</span>
            </button>
            <div id="menu-confirm" class="menu-confirm hidden" role="none">
              <span class="menu-confirm-text">Wipe all progress?</span>
              <div class="menu-confirm-actions">
                <button id="menu-cancel" class="menu-btn-small" role="menuitem">Cancel</button>
                <button id="menu-wipe" class="menu-btn-small menu-danger" role="menuitem">Wipe</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="stage" id="stage">
        <div class="readout">
          <div id="loc" class="loc-count">0</div>
          <div class="loc-label">lines of code</div>
          <div id="lps" class="lps">0 LoC/s</div>
          <div id="effects" class="effects"></div>
        </div>

        <div class="core-wrap" id="core-wrap">
          <button id="core" class="core" aria-label="Write code">
            <svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
              <defs>
                <clipPath id="core-clip">
                  <circle cx="90" cy="90" r="90" />
                </clipPath>
                <radialGradient id="core-blue" cx="106.65" cy="104.92" r="71.08" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#008fc9" />
                  <stop offset=".11" stop-color="#008fc9" stop-opacity=".95" />
                  <stop offset=".28" stop-color="#008fc9" stop-opacity=".82" />
                  <stop offset=".5" stop-color="#008fc9" stop-opacity=".6" />
                  <stop offset=".76" stop-color="#008fc9" stop-opacity=".3" />
                  <stop offset="1" stop-color="#008fc9" stop-opacity="0" />
                </radialGradient>
                <radialGradient id="core-pink" cx="69.97" cy="74.16" r="68.23" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#f64370" />
                  <stop offset=".09" stop-color="#f64370" stop-opacity=".96" />
                  <stop offset=".23" stop-color="#f64370" stop-opacity=".86" />
                  <stop offset=".42" stop-color="#f64370" stop-opacity=".69" />
                  <stop offset=".63" stop-color="#f64370" stop-opacity=".46" />
                  <stop offset=".87" stop-color="#f64370" stop-opacity=".16" />
                  <stop offset="1" stop-color="#f64370" stop-opacity="0" />
                </radialGradient>
              </defs>
              <g clip-path="url(#core-clip)">
                <rect width="180" height="180" fill="#001220" />
                <circle fill="url(#core-blue)" cx="106.65" cy="104.92" r="71.08" />
                <circle fill="url(#core-pink)" cx="69.97" cy="74.16" r="68.23" />
                <path
                  fill="#fff"
                  d="M92.73,113.57v31.96c.58.02,1.17.03,1.76.03,15.24,0,29.05-6.13,39.1-16.06l-22.34-22.34c-4.43,4.03-10.31,6.48-16.76,6.48-.59,0-1.18-.02-1.76-.06M90.72,64.08v-29.65c-28.96,1.94-51.86,26.04-51.86,55.5s22.89,53.56,51.86,55.5v-32.08c-11.97-1.82-21.15-12.16-21.15-24.64s9.18-22.82,21.15-24.64"
                />
              </g>
            </svg>
          </button>
        </div>

        <div class="stage-foot">
          <div class="hint">Click the Core to write code — <kbd>Space</kbd> works too</div>
          <p class="credit">
            Made with ♥︎ by
            <a href="https://www.linkedin.com/in/amadeuszancotti/" target="_blank" rel="noopener noreferrer">
              Amadeus Zancotti
            </a>
          </p>
        </div>
        <div id="floaters" class="floaters" aria-hidden="true"></div>
      </section>

      <aside class="store">
        <div class="funding-panel">
          <div class="funding-info">
            <span class="funding-label">Funding</span>
            <span class="funding-sub">shipped code becomes funding</span>
          </div>
          <span id="funding" class="funding-value">€0</span>
        </div>

        <section class="store-section">
          <div class="store-head">
            <h2>Upgrades</h2>
            <div class="seg-toggle" id="upgrade-tabs" role="tablist" aria-label="Upgrade views">
              <button role="tab" data-tab="store" class="active" aria-selected="true" aria-controls="upgrades">
                Store
              </button>
              <button role="tab" data-tab="active" aria-selected="false" aria-controls="owned">
                Active <span id="owned-count">0</span>
              </button>
            </div>
          </div>
          <div id="upgrades" class="tile-grid store-tray empty" role="tabpanel" aria-label="Upgrade store"></div>
          <div id="owned" class="tile-grid owned-tray empty hidden" role="tabpanel" aria-label="Active upgrades"></div>
        </section>

        <section class="store-section store-section-grow">
          <div class="store-head">
            <h2>Team &amp; Infrastructure</h2>
            <div class="seg-toggle" id="buy-toggle">
              <button data-amount="1" class="active">×1</button>
              <button data-amount="10">×10</button>
              <button data-amount="100">×100</button>
            </div>
          </div>
          <div id="producers" class="producer-list"></div>
        </section>

        <section class="store-section">
          <div class="store-head">
            <h2>Achievements</h2>
            <span class="head-count"><span id="ach-count">0</span>/<span id="ach-total">0</span></span>
          </div>
          <div id="achievements" class="tile-grid" aria-label="Achievements"></div>
        </section>
      </aside>
    </main>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <div id="tooltip" class="tooltip hidden" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
